<figure xmlns:th="http://www.thymeleaf.org" th:fragment="figure(position)" th:class="${position}">
    <a th:href="@{'/' + ${entity.gndIdentifier}}">
        <img id="entity-image" th:src="@{${entity.imageUrl}}" th:alt="${entity.preferredName}" />
    </a>
    <figcaption>
        <small>
            <a th:href="@{'/' + ${entity.gndIdentifier}}" th:text="${entity.preferredName}">
                An entity
            </a>
            <br />
            <span th:utext="${entity.imageAttribution}" style="font-size: 0.6rem !important">
                An attribution
            </span>
        </small>
    </figcaption>
</figure>
