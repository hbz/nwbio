<!DOCTYPE html>
<html
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">
    <head>
        <title>[[#{app.title}]]</title>
    </head>
    <body>
        <div layout:fragment="content">
            <span class="float-end">
                <img
                    class="media-object nrw-logo"
                    th:src="@{/gnd/assets/images/nrw.png}"
                    alt="NRW" />
            </span>
            <h1 class="page-header">
                [[#{app.title}]]
                <small> &mdash; [[#{home.index.headline}]]</small>
            </h1>
            <div class="row">
                <div class="col-9 intro">
                    <div th:utext="${dataset.description.de}"></div>
                    <mark>
                        Das
                        <a href="https://biographie-nrw.uni-muenster.de/">
                            Biographische Portal NRW
                        </a>
                        wird in diesem Entwicklungsprojekt auf Basis von lobid-gnd neu umgesetzt.
                    </mark>
                </div>
                <div class="col-3">
                    <div th:replace="~{fragments/figure}" />
                </div>
            </div>
        </div>
    </body>
</html>
